# A URL do dead man's switch — o serviço externo que grita quando o Alertmanager
# para de bater. É segredo porque quem tiver a URL consegue bater no lugar dele e
# silenciar o alarme de último recurso: o monitoramento pode cair inteiro sem que
# ninguém saiba.
#
# A rota do Alertmanager lê esta URL por `url_file`, de um arquivo montado, e
# nunca por `url` inline. Inline, ela apareceria no YAML da rota e, pior, na
# saída de `amtool config show` de qualquer pod que alcance o Alertmanager.
#
# A chave precisa se chamar `url`: o caminho montado é
# /etc/alertmanager/secrets/alertmanager-deadman/url, e o nome do arquivo é o
# nome da chave do Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-deadman
  namespace: observabilidade
spec:
  # 6h: a URL do snitch é fixa por anos. O que importa aqui não é frescor, é o
  # Secret existir antes de o Alertmanager subir — sem ele o pod fica em
  # ContainerCreating esperando o volume, e o `secrets:` dos values é montagem
  # obrigatória, não opcional.
  refreshInterval: 6h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: alertmanager-deadman
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: observabilidade/deadman
        property: url
