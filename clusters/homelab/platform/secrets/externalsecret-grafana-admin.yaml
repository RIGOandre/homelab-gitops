# Exemplo do caminho normal: o segredo vive no Vault, o Git guarda só o endereço
# dele. Trocar a senha do Grafana é um `vault kv put`, não um commit - por isso o
# ESO existe mesmo já tendo sops no repositório.
#
# O namespace observabilidade é criado pela frente de observabilidade. Enquanto
# ele não existir, este ExternalSecret fica em SecretSyncedError; isso é esperado
# e não é motivo para mexer aqui. Ver docs/runbooks/crashloop.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observabilidade
spec:
  # 1h e não 15s: a senha do admin do Grafana muda uma vez por ano. Refresh curto
  # só multiplica chamada no Vault e ruído no log do ESO.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: grafana-admin
    # Owner: o ESO é dono do Secret gerado e o apaga junto com este objeto. Sem
    # isso, remover o ExternalSecret deixa o Secret órfão no cluster para sempre.
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: observabilidade/grafana
        property: usuario
    - secretKey: admin-password
      remoteRef:
        key: observabilidade/grafana
        property: senha
