# ATENÇÃO: este arquivo NÃO é aplicado pelo Argo CD.
#
# É um patch de merge estratégico consumido pela instalação do Argo CD, em
# bootstrap/. Ele mora num subdiretório justamente para ficar fora do que o
# plugin sops gera (o generate usa -maxdepth 1). Se ele fosse aplicado direto,
# o cluster receberia um Deployment argocd-repo-server pela metade.
#
# Ovo e galinha, explicitado: o Argo CD não consegue instalar o plugin que ele
# precisa para sincronizar o próprio plugin. Por isso o CMP entra no bootstrap e
# não vira Application.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-repo-server
    spec:
      initContainers:
        # Copiar o binário de uma imagem em vez de baixar no start do Pod: o nó
        # é único e reinicia sozinho depois de queda de luz. Um curl no start
        # transforma "internet fora" em "Argo CD não renderiza nada".
        - name: copiar-sops
          image: ghcr.io/getsops/sops:v3.9.4-alpine
          command: [sh, -c, "cp /usr/local/bin/sops /ferramentas/sops"]
          volumeMounts:
            - name: ferramentas
              mountPath: /ferramentas
      containers:
        - name: sops
          # A tag TEM que ser a mesma do repo-server. O binário argocd-cmp-server
          # vem do volume var-files, que é preenchido pelo init container do
          # repo-server; versões diferentes falam protocolos diferentes e o
          # sintoma é o Application ficando em Unknown sem erro no log.
          # Hoje: v2.13.3, mesma de ARGOCD_VERSAO em bootstrap/instalar.sh.
          image: quay.io/argoproj/argocd:v2.13.3
          command: [/var/run/argocd/argocd-cmp-server]
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: SOPS_AGE_KEY_FILE
              value: /etc/sops/age/keys.txt
          volumeMounts:
            - name: var-files
              mountPath: /var/run/argocd
            - name: plugins
              mountPath: /home/argocd/cmp-server/plugins
            - name: cmp-sops-plugin
              mountPath: /home/argocd/cmp-server/config/plugin.yaml
              subPath: plugin.yaml
            - name: cmp-tmp
              mountPath: /tmp
            - name: ferramentas
              mountPath: /usr/local/bin/sops
              subPath: sops
            - name: sops-age
              mountPath: /etc/sops/age
              readOnly: true
      volumes:
        - name: cmp-sops-plugin
          configMap:
            name: argocd-cmp-sops
        # /tmp próprio do sidecar: é onde o cmp-server escreve o repositório
        # durante o render. Compartilhar com o repo-server deixaria o manifesto
        # decifrado visível para um container que não precisa vê-lo.
        - name: cmp-tmp
          emptyDir: {}
        - name: ferramentas
          emptyDir: {}
        - name: sops-age
          secret:
            secretName: sops-age
            # 0400: só leitura, só o dono. A chave privada não é versionada e
            # este Secret é criado à mão no bootstrap - ver docs/segredos.md.
            defaultMode: 0400
