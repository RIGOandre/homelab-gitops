# Plugin de Config Management do Argo CD que decifra os *.enc.yaml na hora de
# renderizar o manifesto.
#
# Por que CMP com sidecar e não deixar o operator ler a chave:
#   - o segredo decifrado só existe dentro do sidecar, em memória, durante o
#     render. Não vira arquivo, não vira Secret intermediário no cluster;
#   - a chave age fica montada em um container só, que não fala com a rede e não
#     roda mais nada. O repo-server continua sem acesso a ela;
#   - funciona para qualquer objeto, não só Secret. Um ConfigMap com uma senha
#     dentro (acontece) também é coberto;
#   - o diff do Argo CD passa a ser o diff do objeto já decifrado, então "OutOfSync"
#     quer dizer alguma coisa. Com o arquivo cifrado aplicado cru, todo sync
#     compararia base64 com base64.
#
# O custo é honesto: o repo-server ganha um sidecar e um init container, e o
# bootstrap passa a ter um pré-requisito manual (o Secret sops-age). Ver
# docs/segredos.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmp-sops
  namespace: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: sops
    spec:
      # Sem `version` de propósito. Com version declarada, o nome que o
      # Application precisa citar vira `sops-v1.0`; sem ela, é só `sops`. O
      # Application em clusters/homelab/apps/platform-secrets.yaml pede `sops`,
      # e o erro de divergência é "plugin not found", que não diz que o problema
      # é o sufixo da versão.

      # Descoberta por glob para o Application não precisar declarar o plugin.
      # Sem isto, um diretório novo com segredo cifrado seria aplicado cru e o
      # Argo CD reclamaria de campo desconhecido "sops" - erro que não diz nada
      # sobre a causa real.
      discover:
        find:
          glob: "*.enc.yaml"

      generate:
        command: [sh, -c]
        args:
          - |
            set -eu
            # maxdepth 1 de propósito: subdiretório aqui é insumo de instalação
            # (o próprio patch do repo-server mora em um), não manifesto para o
            # Argo CD aplicar. Recursivo faria o cluster aplicar o patch como se
            # fosse um Deployment de verdade.
            for f in $(find . -maxdepth 1 -name '*.yaml' ! -name '*.enc.yaml' | sort); do
              echo '---'
              cat "$f"
            done
            for f in $(find . -maxdepth 1 -name '*.enc.yaml' | sort); do
              echo '---'
              sops --decrypt "$f"
            done
