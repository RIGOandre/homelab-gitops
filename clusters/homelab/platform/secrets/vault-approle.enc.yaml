# Secret-id do AppRole que o External Secrets usa para autenticar no Vault.
# É a única credencial do cluster que fica no Git: sem ela o ESO não sobe, e sem
# o ESO nenhum outro segredo chega no cluster. Todo o resto vive no Vault e nunca
# passa por aqui - é o que evita que rotacionar uma senha vire um commit.
#
# O role-id não está aqui de propósito: ele é identificador, não credencial, e
# está em claro no ClusterSecretStore para o diff continuar legível.
