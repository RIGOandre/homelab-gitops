# ClusterSecretStore e não SecretStore: o mesmo Vault serve todos os namespaces do
# cluster. Um SecretStore por namespace daria isolamento melhor, mas exigiria
# copiar o Secret do AppRole para cada namespace - e aí a credencial que a gente
# fez questão de manter em um lugar só estaria em cinco.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      # http e não https: o tráfego não sai do nó, vai de Pod para Pod pela rede
      # do flannel. No dia em que aparecer um segundo nó, este campo é a primeira
      # coisa a mudar, porque aí o tráfego passa a andar na rede de casa.
      server: http://vault.vault.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        appRole:
          path: approle
          # role-id em claro de propósito: ele identifica o papel, não autentica.
          # Sozinho não abre nada. Deixar em claro mantém o diff do PR legível.
          roleId: 2f9b6c48-1d05-4a7e-8c33-6e51b0f2a9d7
          secretRef:
            name: vault-approle
            namespace: external-secrets
            key: secret-id
