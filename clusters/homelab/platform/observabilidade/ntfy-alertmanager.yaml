# A ponte entre o Alertmanager e o ntfy. O código está em ponte-ntfy.py, ao
# lado; o ConfigMap que o carrega é gerado por `make configmaps`.
#
# A primeira versão disto fixava a imagem de um projeto de terceiro. O
# verificador de imagens do CI reprovou a tag — ela não existia — e o registry
# do projeto não respondia à listagem de tags, então não havia como acertar sem
# chutar. Trocar 120 linhas de tradução de JSON por uma dependência cuja versão
# ninguém consegue conferir é o tipo de troca que só aparece na madrugada em que
# o alerta tenta sair e o pod está em ImagePullBackOff.
#
# A imagem base é a oficial do Python, sem nada instalado em cima: a ponte usa
# só biblioteca padrão, de propósito.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy-alertmanager
  namespace: observabilidade
  labels:
    app.kubernetes.io/name: ntfy-alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy-alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy-alertmanager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ponte
          image: python:3.12-alpine
          command: ["python3", "/app/ponte.py"]
          env:
            - name: NTFY_BASE_URL
              value: https://ntfy.sh
            # O ConfigMap é montado somente leitura e o Python tentaria gravar
            # o .pyc ao lado do fonte. Ele desiste em silêncio, mas o erro
            # aparece no log a cada partida e polui o diagnóstico de verdade.
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            # Sem isto, print e log ficam presos no buffer e o log do pod só
            # aparece quando o processo morre — justo quando não dá mais.
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /saude
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /saude
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            - name: codigo
              mountPath: /app
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: codigo
          configMap:
            name: ntfy-alertmanager
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy-alertmanager
  namespace: observabilidade
  labels:
    app.kubernetes.io/name: ntfy-alertmanager
spec:
  selector:
    app.kubernetes.io/name: ntfy-alertmanager
  ports:
    - name: http
      port: 8080
      targetPort: http
