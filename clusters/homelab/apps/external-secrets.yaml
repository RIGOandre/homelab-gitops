# external-secrets: traz os segredos do cofre externo para dentro do cluster, para
# que nenhum valor sensível precise ser versionado neste repositório.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    # Wave 1: dono de CRD. Os ClusterSecretStore/ExternalSecret de
    # platform/secrets (wave 3) dependem destes tipos.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.10.5
    helm:
      values: |
        installCRDs: true
        replicaCount: 1
        webhook:
          replicaCount: 1
        certController:
          replicaCount: 1
        serviceMonitor:
          # Mesma razão do cert-manager: a CRD do Prometheus Operator sobe na
          # mesma wave, sem garantia de ordem entre irmãos.
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
