# Configuração do external-secrets: ClusterSecretStore, credencial do AppRole do
# Vault e os ExternalSecret que materializam os Secrets no cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets
  namespace: argocd
  annotations:
    # Wave 3: são recursos das CRDs que o external-secrets registra na wave 1.
    # A wave também garante que o namespace observabilidade já existe (criado
    # pelo kube-prometheus-stack na wave 1), que é o destino do ExternalSecret
    # do Grafana.
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/RIGOandre/homelab-gitops.git
    targetRevision: main
    path: clusters/homelab/platform/secrets
    plugin:
      # Plugin em vez de diretório simples porque esta pasta tem arquivo cifrado
      # com sops (*.enc.yaml, ver .sops.yaml na raiz). Um arquivo cifrado ainda é
      # YAML válido: o apply direto não falharia, ele aplicaria o Secret com o
      # literal "ENC[AES256_GCM,...]" no lugar do secret-id e o external-secrets
      # ficaria com erro de autenticação no Vault sem nenhuma pista do motivo.
      #
      # O nome tem que bater com o ConfigManagementPlugin do sidecar sops do
      # repo-server, que decifra com a chave age do Secret sops-age (namespace
      # argocd, criado pelo bootstrap/instalar.sh). Sem o sidecar, este
      # Application inteiro falha o sync - o que é o comportamento desejado:
      # falhar alto é melhor do que aplicar credencial cifrada em silêncio.
      name: sops
  destination:
    server: https://kubernetes.default.svc
    # Os manifests cifrados já trazem o próprio namespace; este é o destino do
    # que vier sem namespace declarado.
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
